<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>MONO DECK · 혼합 매크로 테스트</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#111610;color:#e9f0e3;font:14px 'Segoe UI',sans-serif}header{display:flex;align-items:center;justify-content:space-between}small{color:#c7f97a;letter-spacing:2px}h1{font-size:25px;margin:12px 0}p{color:#a5b29b;line-height:1.7}button{cursor:pointer;background:#c7f97a;color:#172310;border:0;border-radius:7px;font-weight:700;padding:13px 20px}button:disabled{opacity:.5;cursor:default}.ghost{background:#273322;color:#d3dfca}.flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:22px 0}.flow span{background:#26351d;border:1px solid #4d6338;padding:9px 12px;border-radius:5px}.field{display:block;margin:20px 0 8px;color:#c2d4b2}textarea{resize:none;width:100%;height:115px;border:2px solid #4c6637;border-radius:8px;background:#1b2416;color:#f3f9ed;padding:18px;font:18px 'Segoe UI',sans-serif}textarea:focus{outline:none;border-color:#c7f97a}.row{display:flex;align-items:center;gap:15px;margin:18px 0}.status{flex:1;color:#bdcdb2}pre{height:143px;overflow:auto;background:#0c100a;border:1px solid #2d3d23;border-radius:8px;padding:14px;white-space:pre-wrap;color:#accc93;font:12px/1.7 Consolas,monospace}.pass{color:#c7f97a}.fail{color:#ffac93}footer{color:#7e9270;font-size:12px}
</style></head><body><header><small>MONO DECK · LIVE TEST</small><button class="ghost" id="close">닫기 · Esc</button></header><h1>여러 종류의 동작을 한 번에.</h1><p>아래 버튼은 실제 마우스와 키보드 입력으로 이 창의 입력란만 시험합니다.<br>시험 중 포커스가 다른 창으로 바뀌면 중지합니다.</p><div class="flow"><span>좌표 이동</span>→<span>왼쪽 클릭</span>→<span>500 ms</span>→<span>Ctrl + A</span>→<span>한글 입력</span>→<span>F8 누름·뗌</span></div><label class="field" for="target">실제 입력을 받을 테스트 공간</label><textarea id="target" spellcheck="false">이 문장이 전체 선택된 뒤 테스트 문장으로 바뀝니다.</textarea><div class="row"><button id="start">복합 매크로 실제 실행</button><span class="status" id="status">실행 대기</span></div><pre id="result">이동·클릭·대기 시간·단축키·문자 입력 결과가 여기에 표시됩니다.</pre><footer>결과는 PC 데이터 폴더의 tests/mixed-macro-latest.json에 저장됩니다. 기기 매핑을 변경하지 않습니다.</footer><script src="testpad-renderer.js"></script></body></html>
